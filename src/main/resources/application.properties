spring.application.name=demo-ai-code-review
# H2 en mémoire
spring.datasource.url=jdbc:h2:mem:userdb
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=faical
spring.datasource.password=faical

# JPA / Hibernate
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true

# ⚠️ INDISPENSABLE : exécuter data.sql APRÈS la création des tables par Hibernate
spring.jpa.defer-datasource-initialization=true

# Exécuter data.sql à chaque démarrage
spring.sql.init.mode=always

# Console H2
spring.h2.console.enabled=true
# Logs plus propres (optionnel)
logging.level.org.hibernate.engine.transaction.jta.platform.internal.JtaPlatformInitiator=ERROR